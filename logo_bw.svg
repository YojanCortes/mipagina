<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Radial glow & gradients for luxury AI feel -->
    <linearGradient id="bwGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141923" />
      <stop offset="100%" stop-color="#05070d" />
    </linearGradient>
    <linearGradient id="bwSilverRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <clipPath id="circleClip">
      <circle cx="250" cy="250" r="236" />
    </clipPath>
  </defs>

  <!-- Outer Ring Base -->
  <circle cx="250" cy="250" r="244" fill="#000000" stroke="url(#bwSilverRing)" stroke-width="12" />
  <circle cx="250" cy="250" r="236" fill="#05070d" />

  <!-- Inside Clipped Content -->
  <g clip-path="url(#circleClip)">
    <!-- Top Half (Pure Dark Black Background) -->
    <rect x="0" y="0" width="500" height="280" fill="url(#bwGradDark)" />

    <!-- Bottom Half (Pure White Background) -->
    <rect x="0" y="278" width="500" height="222" fill="#ffffff" />
    <line x1="0" y1="278" x2="500" y2="278" stroke="#000000" stroke-width="4" />

    <!-- LAPTOP GRAPHIC IN TOP HALF -->
    <!-- Screen Outer Frame -->
    <rect x="135" y="78" width="230" height="150" rx="14" ry="14" fill="none" stroke="#ffffff" stroke-width="16" />
    <!-- Screen Inner Display -->
    <rect x="149" y="92" width="202" height="122" rx="4" ry="4" fill="#060911" />
    <!-- Code Brackets </ > inside screen -->
    <!-- Left Bracket < -->
    <path d="M 215 125 L 180 153 L 215 181" fill="none" stroke="#ffffff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Slash / -->
    <line x1="262" y1="120" x2="238" y2="186" stroke="#ffffff" stroke-width="15" stroke-linecap="round" />
    <!-- Right Bracket > -->
    <path d="M 285 125 L 320 153 L 285 181" fill="none" stroke="#ffffff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Laptop Keyboard / Base -->
    <path d="M 105 240 L 395 240 L 375 258 L 125 258 Z" fill="#ffffff" />
    <!-- Laptop Notch -->
    <path d="M 225 240 L 275 240 L 270 248 L 230 248 Z" fill="#060911" />

    <!-- TYPOGRAPHY IN BOTTOM HALF (BLACK ON WHITE) -->
    <text x="250" y="348" 
          font-family="'Impact', 'Arial Black', 'Outfit', sans-serif" 
          font-size="44" 
          font-weight="900" 
          fill="#05070d" 
          letter-spacing="3" 
          text-anchor="middle">SOLUCIONES</text>
          
    <text x="250" y="420" 
          font-family="'Impact', 'Arial Black', 'Outfit', sans-serif" 
          font-size="52" 
          font-weight="900" 
          fill="#05070d" 
          letter-spacing="4" 
          text-anchor="middle">DIGITALES</text>

    <!-- Subtle AI Circuit Subline Dots -->
    <circle cx="95" cy="460" r="4" fill="#05070d" />
    <circle cx="115" cy="460" r="3" fill="#64748b" />
    <line x1="130" y1="460" x2="370" y2="460" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6,6" />
    <circle cx="385" cy="460" r="3" fill="#64748b" />
    <circle cx="405" cy="460" r="4" fill="#05070d" />
  </g>

  <!-- Inner Silver Shimmer Stroke -->
  <circle cx="250" cy="250" r="236" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
</svg>
